name: Daily NBA Ingest

on:
  schedule:
    # Run daily at 10:00 AM UTC (6 PM SGT / 2 AM PST)
    # NBA games typically end by then for the previous day
    - cron: '0 10 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  ingest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'jobs/requirements.txt'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r jobs/requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Run daily ingest
        working-directory: jobs
        run: python daily_ingest.py
        env:
          GOOGLE_CLOUD_PROJECT: fantasy-survivor-app
